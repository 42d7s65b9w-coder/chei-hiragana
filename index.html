<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆうせい ひらがなクエスト</title>

<style>
body{
  margin:0;
  padding:16px;
  font-family:sans-serif;
  background:#eafaf6;
  color:#263238;
}
main{
  max-width:650px;
  margin:auto;
}
h1{
  text-align:center;
  color:#138b7c;
}
#card{
  height:260px;
  background:white;
  border:5px solid #55c6b7;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:160px;
  font-weight:bold;
  margin:20px 0;
}
#next{
  width:100%;
  border:0;
  border-radius:20px;
  padding:20px;
  background:#ff8055;
  color:white;
  font-size:24px;
  font-weight:bold;
}
section{
  background:white;
  margin-top:22px;
  padding:16px;
  border-radius:20px;
}
.rows{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
input{
  display:none;
}
label{
  display:block;
  padding:12px 2px;
  border:2px solid #ddd;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}
input:checked + label{
  background:#cffff5;
  border-color:#39b7a6;
  color:#08796c;
}
#info{
  text-align:center;
  margin-top:15px;
  color:#607d8b;
}
</style>
</head>

<body>
<main>

<h1>ゆうせい<br>ひらがなクエスト</h1>

<div id="card">？</div>

<button id="next">🎲 つぎの ひらがな！</button>

<section>
  <b>でてくる「行」をえらぶ</b>
  <div class="rows" id="rows"></div>
  <div id="info">あ行 ON ・ 0もん</div>
</section>

</main>

<script>
const kana = {
  "あ行":"あいうえお",
  "か行":"かきくけこ",
  "さ行":"さしすせそ",
  "た行":"たちつてと",
  "な行":"なにぬねの",
  "は行":"はひふへほ",
  "ま行":"まみむめも",
  "や行":"やゆよ",
  "ら行":"らりるれろ",
  "わ行":"わをん"
};

const rows = document.getElementById("rows");
let count = 0;
let last = "";

Object.keys(kana).forEach((name,i)=>{
  rows.innerHTML +=
  '<div><input type="checkbox" id="r'+i+'" value="'+name+'" '+(i===0?'checked':'')+'>'+
  '<label for="r'+i+'">'+name+'</label></div>';
});

document.getElementById("next").onclick = function(){
  const selected = [...document.querySelectorAll("input:checked")];

  if(selected.length===0){
    alert("ひとつ えらんでね！");
    return;
  }

  let pool = "";
  selected.forEach(x => pool += kana[x.value]);

  let choice;
  do{
    choice = pool[Math.floor(Math.random()*pool.length)];
  }while(pool.length>1 && choice===last);

  last = choice;
  count++;

  document.getElementById("card").textContent = choice;
  document.getElementById("info").textContent =
    selected.length+"ぎょう ON ・ "+count+"もん";
};
</script>

</body>
</html>
